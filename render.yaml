services:
  - type: web
    runtime: docker
    name: legal-workflow-admin
    plan: pro
    healthCheckPath: /healthz
    disk:
      name: workflow-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKFLOW_DB_PATH
        value: /var/data/workflow.sqlite
      - key: WORKFLOW_MODE
        value: review_before_submission
      - key: WORKER_ENABLED
        value: "true"
      - key: WORKER_POLL_INTERVAL_MS
        value: "10000"
      - key: WORKER_EMAIL_LIMIT
        value: "50"
      - key: GRAPH_INBOX_PAGE_SIZE
        value: "10"
      - key: GRAPH_REQUEST_MAX_ATTEMPTS
        value: "5"
      - key: GRAPH_BODY_FETCH_CONCURRENCY
        value: "4"
      - key: EMAIL_RETRY_BATCH_SIZE
        value: "10"
      - key: ADMIN_AUTO_SYNC_MS
        value: "60000"
      - key: ADMIN_SYNC_EMAIL_LIMIT
        value: "100"
      - key: DOCUMENT_IMMEDIATE_DOWNLOAD_ATTEMPTS
        value: "3"
      - key: DOCUMENT_AUTO_RETRY_LIMIT
        value: "6"
      - key: DOCUMENT_RETRY_BATCH_SIZE
        value: "2"
      - key: DOCUMENT_RETRY_INITIAL_DELAY_MS
        value: "900000"
      - key: DOCUMENT_RETRY_MAX_DELAY_MS
        value: "43200000"
      - key: MIFILE_DOWNLOAD_TIMEOUT_MS
        value: "90000"
      - key: MIFILE_LOGIN_TIMEOUT_MS
        value: "30000"
      - key: MIFILE_COOKIE_CACHE_MS
        value: "600000"
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: USER_EMAIL
        sync: false
      - key: NOTIFY_TO_EMAIL
        sync: false
      - key: SENDER_USER_ID
        sync: false
      - key: ONEDRIVE_ROOT_SHARE_URL
        sync: false
      - key: MIFILE_USER
        sync: false
      - key: MIFILE_PASSWORD
        sync: false
      - key: TWO_CAPTCHA_API_KEY
        sync: false
      - key: TRUECERTIFY_HEADLESS
        value: "true"
      - key: TRUECERTIFY_DEBUG_DIR
        value: /var/data/captcha_debug
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
