<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Forms | Devlin Law</title>
  <link rel="icon" href="/excel/icon.png">
  <link rel="stylesheet" href="/excel/style.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script defer src="/excel/lucide.js"></script>
  <script defer src="/excel/row.js"></script>
  <script defer src="/excel/workbook.js"></script>
  <script defer src="/excel/session.js"></script>
  <script defer src="/excel/app.js"></script>
</head>
<body>
  <header><img src="/excel/icon.png" width="32" height="32" alt=""><div><strong>PDF Forms</strong><span>Devlin Law PLLC</span></div>
    <button id="logout" class="icon" title="Disconnect" aria-label="Disconnect" hidden><i data-lucide="log-out"></i></button>
  </header>
  <main>
    <section id="signIn" hidden>
      <h1>Connect Excel</h1>
      <form id="loginForm">
        <label for="username">Admin username</label><input id="username" autocomplete="username" maxlength="254" required>
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" maxlength="1024" required>
        <button id="login" class="primary" type="submit">Connect for 12 hours</button>
      </form>
    </section>
    <section id="connection" hidden>
      <h1>Reconnecting</h1>
      <button id="reconnect" class="primary" type="button"><i data-lucide="refresh-cw"></i><span>Reconnect</span></button>
    </section>
    <section id="workspace" hidden>
      <div class="section-heading"><h1>Selected case</h1><button id="refresh" class="icon" title="Refresh selected row" aria-label="Refresh selected row"><i data-lucide="refresh-cw"></i></button></div>
      <p id="selection" class="secondary">Connecting to Excel...</p>
      <p id="caseName" class="case-name"></p>
      <p id="caseContext" class="secondary"></p>
      <label for="form">Court form</label>
      <select id="form" disabled><option value="">Loading forms...</option></select>
      <div id="fileNaming" hidden>
        <label for="filename">File name</label>
        <div class="filename-field"><input id="filename" maxlength="174" autocomplete="off" spellcheck="false" disabled><button id="resetFilename" type="button" class="icon" title="Restore automatic file name" aria-label="Restore automatic file name" disabled><i data-lucide="rotate-ccw"></i></button></div>
      </div>
      <div id="deliveryOptions" hidden><label class="check-label"><input id="autoSave" type="checkbox">Save to OneDrive automatically</label><p id="destination" class="secondary"></p></div>
      <button id="generate" class="primary" disabled><i data-lucide="file-plus-2"></i><span>Generate PDF</span></button>
      <button id="generatePackage" disabled><i data-lucide="archive"></i><span>Generate all 3 forms (ZIP)</span></button>
      <section id="packageResult" hidden>
        <h2>Three-form package</h2>
        <ul id="packageFiles" class="secondary"></ul>
        <a id="downloadPackage" class="save"><i data-lucide="download"></i><span>Download ZIP</span></a>
      </section>
      <section id="result" hidden>
        <div class="section-heading"><h2>Generated PDF</h2><div class="result-tools"><button id="back" class="icon" title="Back to form" aria-label="Back to form"><i data-lucide="arrow-left"></i></button><a id="download" class="icon" title="Download fillable PDF" aria-label="Download fillable PDF"><i data-lucide="download"></i></a></div></div>
        <p id="resultName" class="secondary"></p>
        <div id="preview" aria-label="Generated PDF preview"></div>
        <a id="save" class="save" download>Download PDF</a>
        <div id="cloudActions" hidden><button id="saveCloud" class="save"><i data-lucide="cloud-upload"></i><span>Save to OneDrive</span></button><a id="openCloud" class="icon" title="Open saved OneDrive file" aria-label="Open saved OneDrive file" target="_blank" rel="noopener noreferrer" hidden><i data-lucide="external-link"></i></a></div>
      </section>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" aria-live="assertive"></p>
    <details id="sourceIssues" hidden open><summary id="sourceIssuesTitle">Source issues</summary><ul id="sourceIssueList"></ul></details>
  </main>
</body>
</html>
